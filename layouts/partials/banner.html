<!-- Banner轮播 - 全屏宽度 -->
<div id="flash" style="width: 100%; margin: 0; padding: 0; position: relative; overflow: hidden;">
 <div class="banner-slider" style="position: relative; width: 100%; height: 400px;">
  <div class="banner-slide active" style="background-image:url({{ "upload/image/20231212/1702372742874832.png" | relURL }}); width: 100%; height: 100%; background-size: cover; background-position: center; position: absolute; top: 0; left: 0; opacity: 1; transition: opacity 1s ease-in-out;"></div>
  <div class="banner-slide" style="background-image:url({{ "upload/image/20231212/1702363142246975.png" | relURL }}); width: 100%; height: 100%; background-size: cover; background-position: center; position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 1s ease-in-out;"></div>
  <div class="banner-slide" style="background-image:url({{ "upload/image/20240822/1724315752709181.png" | relURL }}); width: 100%; height: 100%; background-size: cover; background-position: center; position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 1s ease-in-out;"></div>
  <div class="banner-slide" style="background-image:url({{ "upload/image/20240822/1724314382502077.jpg" | relURL }}); width: 100%; height: 100%; background-size: cover; background-position: center; position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 1s ease-in-out;"></div>
 </div>
 <div class="banner_bar" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px;">
  <a class="banner_btn current" href="javascript:void(0);" onclick="showSlide(0)" style="width: 12px; height: 12px; border-radius: 50%; background: #fff; display: block; cursor: pointer; opacity: 1;"></a>
  <a class="banner_btn" href="javascript:void(0);" onclick="showSlide(1)" style="width: 12px; height: 12px; border-radius: 50%; background: #fff; display: block; cursor: pointer; opacity: 0.5;"></a>
  <a class="banner_btn" href="javascript:void(0);" onclick="showSlide(2)" style="width: 12px; height: 12px; border-radius: 50%; background: #fff; display: block; cursor: pointer; opacity: 0.5;"></a>
  <a class="banner_btn" href="javascript:void(0);" onclick="showSlide(3)" style="width: 12px; height: 12px; border-radius: 50%; background: #fff; display: block; cursor: pointer; opacity: 0.5;"></a>
 </div>
</div>

<script>
if (typeof currentSlide === 'undefined') {
 let currentSlide = 0;
 const slides = document.querySelectorAll('.banner-slide');
 const buttons = document.querySelectorAll('.banner_btn');
 const totalSlides = slides.length;

 function showSlide(index) {
  // 隐藏所有幻灯片
  slides.forEach(slide => {
   slide.style.opacity = '0';
  });
  
  // 重置所有按钮
  buttons.forEach(btn => {
   btn.style.opacity = '0.5';
   btn.classList.remove('current');
  });
  
  // 显示当前幻灯片
  slides[index].style.opacity = '1';
  buttons[index].style.opacity = '1';
  buttons[index].classList.add('current');
  
  currentSlide = index;
 }

 // 自动轮播
 function autoSlide() {
  currentSlide = (currentSlide + 1) % totalSlides;
  showSlide(currentSlide);
 }

 // 每5秒切换一次
 setInterval(autoSlide, 5000);
}
</script>
