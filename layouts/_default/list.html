{{ define "main" }}
<div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}
    <div class="content">
        {{ . }}
    </div>
    {{ end }}
    
    {{ range .Pages }}
    <article class="summary">
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        {{ with .Description }}
        <p>{{ . }}</p>
        {{ end }}
        <p class="meta">{{ .Date.Format "2006-01-02" }}</p>
    </article>
    {{ end }}
</div>
{{ end }}
