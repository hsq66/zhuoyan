######################## default configuration ####################
baseURL = "https://hsq66.github.io/zhuoyan/"
title = "卓研 - 知识库与支持中心"
theme = "dot-hugo"
timeZone = "Asia/Shanghai"
pagination.pagerSize = 10
summaryLength = 20
disableLanguages = ["fr"]
hasCJKLanguage = true
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false

########################## Permalinks ############################
[permalinks.page]
"pages" = "/:slugorcontentbasename/"

########################### Services #############################
[services]
[services.googleAnalytics]
ID = '' # 添加你的 Google Analytics ID

############################# Modules ############################
[module]
[[module.mounts]]
source = "dot-hugo/assets"
target = "assets"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "dot-hugo/layouts"
target = "layouts"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "dot-hugo/static"
target = "static"

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "hugo_stats.json"
target = "assets/watching/hugo_stats.json"

############################# Build ##############################
[build]
writeStats = true
noJSConfigInAssets = false
useResourceCacheWhen = 'fallback'
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/watching/hugo_stats\.json'
target = 'style\.css'
[[build.cachebusters]]
source = '(postcss)\.config\.js'
target = 'css'
[[build.cachebusters]]
source = 'assets/.*\.(js|ts|jsx|tsx)'
target = 'js'
[[build.cachebusters]]
source = 'assets/.*\.(css|scss|sass)'
target = 'css'
[[build.cachebusters]]
source = 'data/.*\.(.*)$'
target = 'css'
[[build.cachebusters]]
source = 'assets/.*\.(.*)$'
target = '$1'

############################# Outputs ############################
[outputs]
home = ["HTML", "RSS", "SearchIndex"]

############################# Imaging ##############################
[imaging]
quality = 90

############################# Caches ###############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"

############################# Markup ###############################
[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = 'monokai'

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = true

########################### Output Format ##########################
[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "searchindex"
isPlainText = true
notAlternative = true

######################### site variables ##############################
[params.variables]
color_primary = "#02007e"
body_color = "#f9f9f9"
text_color = "#636363"
text_dark = "#242738"
text_light = "#f8f9fa"
black = "#000"
white = "#fff"
dark = "#222"
light = "#eee"
font_size = "16px"
font_scale = "1.17"
font_primary = "Noto+Sans+SC:wght@300;400;700"
font_primary_type = "sans-serif"
font_secondary = ""
font_secondary_type = ""
font_icon = "Font Awesome 6 Free"

############################# Plugins ##############################
[[params.plugins.css]]
link = "plugins/themify-icons/icons.css"

[[params.plugins.js]]
link = "js/search.js"

[[params.plugins.js]]
link = "plugins/webfont/webfont-loader-2.js"

[[params.plugins.js]]
link = "plugins/glightbox.js"

[[params.plugins.js]]
link = "plugins/youtube-lite.js"

[[params.plugins.js]]
link = "plugins/cookie.js"

[[params.plugins.js]]
link = "plugins/lazy-loader.js"
